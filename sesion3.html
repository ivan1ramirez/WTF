<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Sesión de Coaching Vocacional</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            padding: 30px;
            margin-bottom: 20px;
        }

        .header h1 {
            color: #4c51bf;
            font-size: 28px;
            margin-bottom: 20px;
        }

        .client-info {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-size: 14px;
            font-weight: 600;
            color: #4a5568;
            margin-bottom: 8px;
        }

        .form-group input {
            padding: 10px 15px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        .timer {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #edf2f7;
            padding: 15px;
            border-radius: 8px;
            color: #4c51bf;
            font-weight: 600;
        }

        .phases-section {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            padding: 30px;
            margin-bottom: 20px;
        }

        .phases-section h2 {
            color: #2d3748;
            font-size: 20px;
            margin-bottom: 15px;
        }

        .phase-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .phase-btn {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            background: #edf2f7;
            color: #4a5568;
        }

        .phase-btn:hover {
            background: #e2e8f0;
        }

        .phase-btn.active {
            background: #667eea;
            color: white;
            box-shadow: 0 4px 6px rgba(102, 126, 234, 0.4);
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        @media (max-width: 1024px) {
            .main-content {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            padding: 30px;
        }

        .card h2 {
            color: #2d3748;
            font-size: 20px;
            margin-bottom: 20px;
        }

        .suggested-questions {
            margin-bottom: 20px;
        }

        .suggested-questions h3 {
            font-size: 14px;
            color: #4a5568;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .question-btn {
            width: 100%;
            text-align: left;
            padding: 12px 15px;
            margin-bottom: 8px;
            border: none;
            border-radius: 8px;
            background: #edf2f7;
            color: #4c51bf;
            font-size: 13px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .question-btn:hover {
            background: #e2e8f0;
        }

        .form-section {
            margin-bottom: 15px;
        }

        .form-section label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #4a5568;
            margin-bottom: 8px;
        }

        textarea {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            resize: vertical;
            transition: border-color 0.3s;
        }

        textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn-primary {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 8px;
            background: #667eea;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-primary:hover {
            background: #5a67d8;
        }

        .btn-download {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            background: #48bb78;
            color: white;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-download:hover {
            background: #38a169;
        }

        .btn-download:disabled {
            background: #cbd5e0;
            cursor: not-allowed;
        }

        .entries-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .entries-list {
            max-height: 600px;
            overflow-y: auto;
        }

        .entry-card {
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            transition: box-shadow 0.3s;
        }

        .entry-card:hover {
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .entry-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 10px;
        }

        .entry-badge {
            display: inline-block;
            background: #edf2f7;
            color: #4c51bf;
            font-size: 11px;
            font-weight: 600;
            padding: 4px 8px;
            border-radius: 4px;
        }

        .entry-time {
            font-size: 12px;
            color: #a0aec0;
            margin-left: 10px;
        }

        .btn-delete {
            background: none;
            border: none;
            color: #f56565;
            cursor: pointer;
            padding: 5px;
            transition: color 0.3s;
            font-size: 18px;
        }

        .btn-delete:hover {
            color: #e53e3e;
        }

        .entry-content {
            margin-top: 10px;
        }

        .entry-label {
            font-size: 13px;
            font-weight: 600;
            color: #4a5568;
            margin-bottom: 5px;
        }

        .entry-text {
            font-size: 13px;
            color: #718096;
            margin-bottom: 10px;
            line-height: 1.5;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #a0aec0;
        }

        .empty-state svg {
            width: 64px;
            height: 64px;
            margin-bottom: 15px;
            opacity: 0.5;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📋 Registro de Sesión de Coaching Vocacional</h1>
            
            <div class="client-info">
                <div class="form-group">
                    <label>Nombre del Cliente</label>
                    <input type="text" id="clientName" placeholder="Ingresa el nombre del cliente">
                </div>
                <div class="form-group">
                    <label>Fecha de la Sesión</label>
                    <input type="date" id="sessionDate">
                </div>
            </div>

            <div class="timer">
                <span>⏱️</span>
                <span id="timerDisplay">Tiempo acumulado: 0 / 60 minutos</span>
            </div>
        </div>

        <div class="phases-section">
            <h2>Fases de la Sesión</h2>
            <div class="phase-buttons" id="phaseButtons"></div>
        </div>

        <div class="main-content">
            <div class="card">
                <h2 id="currentPhaseTitle">Fase 1: Bienvenida</h2>

                <div class="suggested-questions">
                    <h3>Preguntas Sugeridas:</h3>
                    <div id="suggestedQuestions"></div>
                </div>

                <div class="form-section">
                    <label>Pregunta del Coach</label>
                    <textarea id="questionInput" rows="3" placeholder="Escribe la pregunta realizada..."></textarea>
                </div>

                <div class="form-section">
                    <label>Respuesta del Cliente</label>
                    <textarea id="answerInput" rows="5" placeholder="Registra la respuesta del cliente..."></textarea>
                </div>

                <button class="btn-primary" onclick="addEntry()">
                    <span>➕</span>
                    Agregar Registro
                </button>
            </div>

            <div class="card">
                <div class="entries-header">
                    <h2>Registros de la Sesión (<span id="entriesCount">0</span>)</h2>
                    <button class="btn-download" id="downloadBtn" onclick="downloadSession()" disabled>
                        <span>⬇️</span>
                        Descargar TXT
                    </button>
                </div>

                <div class="entries-list" id="entriesList">
                    <div class="empty-state">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
                        </svg>
                        <p>No hay registros aún. Comienza agregando preguntas y respuestas.</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        var phases = [
            { 
                id: 0, 
                name: 'Bienvenida y Establecimiento de Intención', 
                time: 5,
                suggestedQuestions: [
                    '¿Qué esperas lograr concretamente al final de esta hora?',
                    '¿Qué te trae aquí hoy?',
                    'En una escala del 1 al 10, ¿qué tan listo/a te sientes para comprometerte con cambios?'
                ]
            },
            { 
                id: 1, 
                name: 'Mi Definición de Éxito Personal', 
                time: 15,
                suggestedQuestions: [
                    '¿Qué significa el éxito para ti, basándote en tus vivencias y lo que realmente valoras?',
                    'Describe tu "día perfecto" dentro de 3 años: ¿Qué haces? ¿Con quién estás? ¿Cómo te sientes?',
                    '¿Qué actividades te hacen sentir más vivo/a y con propósito?',
                    '¿Qué legado o impacto quieres dejar con tu trabajo?'
                ]
            },
            { 
                id: 2, 
                name: 'Conversión a Objetivos SMART', 
                time: 25,
                suggestedQuestions: [
                    'ESPECÍFICO: De las opciones que has explorado, ¿cuál se alinea mejor con tu definición de éxito?',
                    'MEDIBLE: ¿Cómo sabrás que has alcanzado este objetivo? ¿Qué indicadores concretos usarás?',
                    'ALCANZABLE: ¿Qué recursos, habilidades o conocimientos necesitas?',
                    'RELEVANTE: ¿Por qué es importante para ti lograr esto AHORA?',
                    'TEMPORALIZABLE: ¿Cuál es el plazo realista para este objetivo?'
                ]
            },
            { 
                id: 3, 
                name: 'Diseño del Plan de Acción', 
                time: 10,
                suggestedQuestions: [
                    '¿Cuál es la primera acción física que puedes tomar HOY o MAÑANA?',
                    '¿Qué necesitas investigar, con quién necesitas conectar?',
                    '¿Qué obstáculos anticipas y cómo los superarás?',
                    '¿Cuándo específicamente realizarás cada acción?'
                ]
            },
            { 
                id: 4, 
                name: 'Cierre y Compromiso', 
                time: 5,
                suggestedQuestions: [
                    '¿Cuál fue tu mayor descubrimiento sobre ti mismo/a en esta sesión?',
                    '¿Qué compromiso específico haces contigo mismo/a?',
                    '¿Cómo te asegurarás de cumplir tus acciones?'
                ]
            }
        ];

        var currentPhase = 0;
        var entries = [];

        document.getElementById('sessionDate').valueAsDate = new Date();
        renderPhaseButtons();
        updatePhaseDisplay();

        function renderPhaseButtons() {
            var container = document.getElementById('phaseButtons');
            var html = '';
            for (var i = 0; i < phases.length; i++) {
                var phase = phases[i];
                var activeClass = i === 0 ? 'active' : '';
                html += '<button class="phase-btn ' + activeClass + '" onclick="setPhase(' + i + ')">';
                html += (i + 1) + '. ' + phase.name + ' (' + phase.time + 'min)';
                html += '</button>';
            }
            container.innerHTML = html;
        }

        function setPhase(phaseId) {
            currentPhase = phaseId;
            var buttons = document.querySelectorAll('.phase-btn');
            for (var i = 0; i < buttons.length; i++) {
                if (i === phaseId) {
                    buttons[i].classList.add('active');
                } else {
                    buttons[i].classList.remove('active');
                }
            }
            updatePhaseDisplay();
            updateTimer();
        }

        function updatePhaseDisplay() {
            var phase = phases[currentPhase];
            document.getElementById('currentPhaseTitle').textContent = 
                'Fase ' + (currentPhase + 1) + ': ' + phase.name;
            
            var questionsContainer = document.getElementById('suggestedQuestions');
            var html = '';
            for (var i = 0; i < phase.suggestedQuestions.length; i++) {
                var q = phase.suggestedQuestions[i];
                var escapedQ = q.replace(/'/g, "\\'");
                html += '<button class="question-btn" onclick="useSuggestedQuestion(\'' + escapedQ + '\')">';
                html += q;
                html += '</button>';
            }
            questionsContainer.innerHTML = html;
        }

        function updateTimer() {
            var totalTime = 0;
            for (var i = 0; i <= currentPhase; i++) {
                totalTime += phases[i].time;
            }
            document.getElementById('timerDisplay').textContent = 
                'Tiempo acumulado: ' + totalTime + ' / 60 minutos';
        }

        function useSuggestedQuestion(question) {
            document.getElementById('questionInput').value = question;
        }

        function addEntry() {
            var question = document.getElementById('questionInput').value.trim();
            var answer = document.getElementById('answerInput').value.trim();

            if (!question || !answer) {
                alert('Por favor completa tanto la pregunta como la respuesta');
                return;
            }

            var entry = {
                id: Date.now(),
                phase: phases[currentPhase].name,
                phaseId: currentPhase,
                question: question,
                answer: answer,
                timestamp: new Date().toLocaleTimeString('es-ES')
            };

            entries.push(entry);
            document.getElementById('questionInput').value = '';
            document.getElementById('answerInput').value = '';
            renderEntries();
        }

        function deleteEntry(id) {
            if (confirm('¿Estás seguro de eliminar este registro?')) {
                entries = entries.filter(function(e) {
                    return e.id !== id;
                });
                renderEntries();
            }
        }

        function renderEntries() {
            var container = document.getElementById('entriesList');
            document.getElementById('entriesCount').textContent = entries.length;
            document.getElementById('downloadBtn').disabled = entries.length === 0;

            if (entries.length === 0) {
                container.innerHTML = '<div class="empty-state">' +
                    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">' +
                    '<path d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>' +
                    '</svg>' +
                    '<p>No hay registros aún. Comienza agregando preguntas y respuestas.</p>' +
                    '</div>';
                return;
            }

            var html = '';
            for (var i = 0; i < entries.length; i++) {
                var entry = entries[i];
                html += '<div class="entry-card">';
                html += '<div class="entry-header">';
                html += '<div>';
                html += '<span class="entry-badge">' + entry.phase + '</span>';
                html += '<span class="entry-time">' + entry.timestamp + '</span>';
                html += '</div>';
                html += '<button class="btn-delete" onclick="deleteEntry(' + entry.id + ')">🗑️</button>';
                html += '</div>';
                html += '<div class="entry-content">';
                html += '<div class="entry-label">Pregunta:</div>';
                html += '<div class="entry-text">' + entry.question + '</div>';
                html += '<div class="entry-label">Respuesta:</div>';
                html += '<div class="entry-text">' + entry.answer + '</div>';
                html += '</div>';
                html += '</div>';
            }
            container.innerHTML = html;
        }

        function downloadSession() {
            var clientName = document.getElementById('clientName').value || 'No especificado';
            var sessionDate = document.getElementById('sessionDate').value;

            var content = 'SESIÓN DE COACHING VOCACIONAL\n';
            content += '=================================\n\n';
            content += 'Cliente: ' + clientName + '\n';
            content += 'Fecha: ' + sessionDate + '\n';
            content += 'Duración: 60 minutos\n\n';
            content += '=================================\n\n';

            for (var p = 0; p < phases.length; p++) {
                var phase = phases[p];
                var phaseEntries = [];
                for (var i = 0; i < entries.length; i++) {
                    if (entries[i].phaseId === phase.id) {
                        phaseEntries.push(entries[i]);
                    }
                }
                
                if (phaseEntries.length > 0) {
                    content += '\n### FASE ' + (phase.id + 1) + ': ' + phase.name.toUpperCase() + ' (' + phase.time + ' min)\n';
                    content += '==================================================\n\n';
                    
                    for (var i = 0; i < phaseEntries.length; i++) {
                        var entry = phaseEntries[i];
                        content += '[' + entry.timestamp + '] Pregunta ' + (i + 1) + ':\n' + entry.question + '\n\n';
                        content += 'Respuesta:\n' + entry.answer + '\n\n';
                        content += '--------------------------------------------------\n\n';
                    }
                }
            }

            content += '\n\n=================================\n';
            content += 'FIN DE LA SESIÓN\n';
            content += 'Total de intercambios registrados: ' + entries.length + '\n';

            var blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
            var url = URL.createObjectURL(blob);
            var link = document.createElement('a');
            link.href = url;
            link.download = 'coaching_session_' + clientName.replace(/\s+/g, '_') + '_' + sessionDate + '.txt';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
        }
    </script>
</body>
</html>
