            // Estados
            const [respuestas, setRespuestas] = useState({});

                    content: '¡Hola! Soy tu coach personal con IA. Responde las 58 preguntas de evaluación y te ayudaré a crear un plan de coaching personalizado. 😊'

            const areas = Object.keys(preguntasCompletas);
            const totalPreguntas = Object.values(preguntasCompletas).reduce((total, area) => total + area.preguntas.length, 0);

            // Inicializar respuestas
            useEffect(() => {
                const initialResponses = {};
                Object.keys(preguntasCompletas).forEach(areaName => {
                    initialResponses[areaName] = {};
                    preguntasCompletas[areaName].preguntas.forEach((pregunta, index) => {
                        initialResponses[areaName][index] = pregunta.puntuacion;
                    });
                });
                setRespuestas(initialResponses);
            }, []);

            // Dibujar rueda de la vida
            useEffect(() => {
                drawWheel();
            }, [respuestas]);

            // Inicializar iconos de Lucide
            useEffect(() => {
                if (typeof lucide !== 'undefined') {
                    lucide.createIcons();
                }
            }, [chatMessages, isAnalyzing]);

            const calcularPromedioArea = (areaName) => {
                if (!respuestas[areaName]) return 5;
                const valores = Object.values(respuestas[areaName]);
                return valores.length > 0 ? valores.reduce((a, b) => a + b, 0) / valores.length : 5;
            };

            const calcularProgreso = () => {
                let preguntasRespondidas = 0;
                Object.values(respuestas).forEach(area => {
                    preguntasRespondidas += Object.keys(area).length;
                });
                return Math.round((preguntasRespondidas / totalPreguntas) * 100);
            };

            const drawWheel = () => {
                const canvas = canvasRef.current;
                if (!canvas) return;
                
                const ctx = canvas.getContext('2d');
                const centerX = canvas.width / 2;
                const centerY = canvas.height / 2;
                const maxRadius = 120;
                
                // Limpiar canvas
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                
                // Dibujar círculos concéntricos
                for (let i = 2; i <= 10; i += 2) {
                    ctx.beginPath();
                    ctx.arc(centerX, centerY, (maxRadius * i / 10), 0, 2 * Math.PI);
                    ctx.strokeStyle = '#f0f0f0';
                    ctx.lineWidth = 1;
                    ctx.stroke();
                }
                
                // Dibujar sectores
                const anglePerArea = (2 * Math.PI) / areas.length;
                
                areas.forEach((areaName, index) => {
                    const score = calcularPromedioArea(areaName);
                    const color = preguntasCompletas[areaName].color;
                    const startAngle = index * anglePerArea - Math.PI / 2;
                    const endAngle = (index + 1) * anglePerArea - Math.PI / 2;
                    const radius = (maxRadius * score / 10);
                    
                    // Dibujar sector
                    ctx.beginPath();
                    ctx.moveTo(centerX, centerY);
                    ctx.arc(centerX, centerY, radius, startAngle, endAngle);
                    ctx.closePath();
                    ctx.fillStyle = color + '80';
                    ctx.fill();
                    ctx.strokeStyle = color;
                    ctx.lineWidth = 2;
                    ctx.stroke();
                    
                    // Líneas divisorias
                    ctx.beginPath();
                    ctx.moveTo(centerX, centerY);
                    ctx.lineTo(
                        centerX + maxRadius * Math.cos(startAngle),
                        centerY + maxRadius * Math.sin(startAngle)
                    );
                    ctx.strokeStyle = '#ddd';
                    ctx.lineWidth = 1;
                    ctx.stroke();
                    
                    // Etiquetas
                    const labelAngle = startAngle + anglePerArea / 2;
                    const labelRadius = maxRadius + 25;
                    const labelX = centerX + labelRadius * Math.cos(labelAngle);
                    const labelY = centerY + labelRadius * Math.sin(labelAngle);
                    
                    ctx.fillStyle = '#2c3e50';
                    ctx.font = '10px Arial';
                    ctx.textAlign = 'center';
                    ctx.fillText(areaName, labelX, labelY);
                });
            };

            const updateRespuesta = (areaName, questionIndex, value) => {

CONTEXTO: El usuario completó una evaluación integral de 58 preguntas específicas distribuidas en 8 áreas de vida.

${resumenCompleto}

1. 📊 DIAGNÓSTICO INTEGRAL:
- Análisis de fortalezas principales
- Áreas de mayor oportunidad de mejora
- Patrones emocionales identificados
- Interconexiones entre áreas

2. 🎯 PLAN DE ACCIÓN ESPECÍFICO:
- 3 objetivos SMART prioritarios (30, 60, 90 días)
- Estrategias específicas para cada área crítica
- Actividades diarias/semanales concretas
- Métricas de seguimiento

3. 💡 RECOMENDACIONES PERSONALIZADAS:
- Técnicas específicas basadas en las respuestas
- Recursos recomendados (libros, apps, ejercicios)
- Estrategias de mantenimiento de motivación

4. 🚀 PRÓXIMOS PASOS INMEDIATOS:
- Qué hacer en los próximos 7 días
- Cómo implementar cambios gradualmente

ESTILO: Empático, motivador, específico y accionable. Usa el nombre de las subcategorías específicas que puntuaron bajo.
LONGITUD: Detallado pero estructurado, máximo 800 palabras.

Inicia con un saludo personal y termina con palabras de motivación.`
                            }]
                        })
                    });

                        type: 'ai',
                        content: planCoaching
                    }]);
                    
                } catch (error) {

                        content: planDemo

                } finally {

            const prepararDatosParaIA = () => {

                    resumen += `${areaName} (Promedio: ${promedio.toFixed(1)}/10):\n`;

                        resumen += `- ${pregunta.subcategoria}: ${puntuacion}/10\n`;
                    });
                    resumen += "\n";
                });
                
                const promedios = areas.map(area => calcularPromedioArea(area));
                const promedioGeneral = promedios.reduce((a, b) => a + b, 0) / promedios.length;
                const areaMasFuerte = areas[promedios.indexOf(Math.max(...promedios))];
                const areaMasDebil = areas[promedios.indexOf(Math.min(...promedios))];

- Promedio general: ${promedioGeneral.toFixed(1)}/10
- Área más fuerte: ${areaMasFuerte} (${Math.max(...promedios).toFixed(1)}/10)
- Área con mayor oportunidad: ${areaMasDebil} (${Math.min(...promedios).toFixed(1)}/10)`;
                
                return resumen;
            };

¡Felicidades por completar tu evaluación integral! He analizado tus 58 respuestas específicas.

📊 **DIAGNÓSTICO INTEGRAL:**

**Tu Fortaleza Principal:** ${areaMasFuerte} (${Math.max(...promedios).toFixed(1)}/10)
¡Excelente! Esta área es tu motor de impulso. Las habilidades que demuestras aquí pueden ser transferidas a otras áreas de tu vida.
